<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Task 7.1 - HTML5 Canvas Graphical Arts</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #1f2937;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: #111827;
    }

    p.subtitle {
      color: #4b5563;
      margin-bottom: 35px;
      font-size: 0.95rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(228px, 1fr));
      gap: 24px;
      max-width: 1020px;
      margin: 0 auto;
      justify-items: center;
    }

    .art-card {
      background: #ffffff;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 228px;
    }

    canvas {
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background-color: #ffffff;
      display: block;
    }

    .label {
      margin-top: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #374151;
    }
  </style>
</head>
<body>

  <h1>Learning Task 7.1: HTML5 Canvas Graphical Arts</h1>
  <p class="subtitle">8 Original Vector-Style Canvas Illustrations (200 &times; 200 px)</p>

  <div class="gallery">
    <div class="art-card">
      <canvas id="art1" width="200" height="200"></canvas>
      <div class="label">1. Ringed Planet</div>
    </div>

    <div class="art-card">
      <canvas id="art2" width="200" height="200"></canvas>
      <div class="label">2. Potted Cactus</div>
    </div>

    <div class="art-card">
      <canvas id="art3" width="200" height="200"></canvas>
      <div class="label">3. Lighthouse Beacon</div>
    </div>

    <div class="art-card">
      <canvas id="art4" width="200" height="200"></canvas>
      <div class="label">4. Vintage Camera</div>
    </div>

    <div class="art-card">
      <canvas id="art5" width="200" height="200"></canvas>
      <div class="label">5. Sailboat at Sunset</div>
    </div>

    <div class="art-card">
      <canvas id="art6" width="200" height="200"></canvas>
      <div class="label">6. Hot Air Balloon</div>
    </div>

    <div class="art-card">
      <canvas id="art7" width="200" height="200"></canvas>
      <div class="label">7. Mountain Tent Camp</div>
    </div>

    <div class="art-card">
      <canvas id="art8" width="200" height="200"></canvas>
      <div class="label">8. Crescent Moon &amp; Clouds</div>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------
    // 1. RINGED PLANET (Gradients, Arcs, Ellipse, Shadows)
    // ---------------------------------------------------------
    (() => {
      const ctx = document.getElementById('art1').getContext('2d');
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 200, 200);

      // Stars
      const stars = [[30, 35, 2], [165, 45, 2.5], [45, 160, 1.8], [170, 155, 2], [100, 25, 1.5]];
      ctx.fillStyle = '#f8fafc';
      stars.forEach(([x, y, r]) => {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Back half of ring
      ctx.save();
      ctx.translate(100, 100);
      ctx.rotate(-0.35);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.ellipse(0, 0, 80, 22, 0, Math.PI, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Planet Sphere
      const grad = ctx.createRadialGradient(82, 82, 8, 100, 100, 48);
      grad.addColorStop(0, '#fde047');
      grad.addColorStop(0.55, '#f97316');
      grad.addColorStop(1, '#9a3412');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(100, 100, 46, 0, Math.PI * 2);
      ctx.fill();

      // Front half of ring
      ctx.save();
      ctx.translate(100, 100);
      ctx.rotate(-0.35);
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.ellipse(0, 0, 80, 22, 0, 0, Math.PI);
      ctx.stroke();
      ctx.restore();
    })();

    // ---------------------------------------------------------
    // 2. POTTED CACTUS (Round Caps, Polygons, Flower Arcs)
    // ---------------------------------------------------------
    (() => {
      const ctx = document.getElementById('art2').getContext('2d');
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(0, 0, 200, 200);

      // Left & Right Cactus Arms
      ctx.strokeStyle = '#15803d';
      ctx.lineWidth = 18;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(100, 110);
      ctx.lineTo(64, 110);
      ctx.lineTo(64, 78);
      ctx.moveTo(100, 96);
      ctx.lineTo(136, 96);
      ctx.lineTo(136, 66);
      ctx.stroke();

      // Main Cactus Trunk
      ctx.strokeStyle = '#16a34a';
      ctx.lineWidth = 28;
      ctx.beginPath();
      ctx.moveTo(100, 132);
      ctx.lineTo(100, 52);
      ctx.stroke();

      // Cactus Ribs
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(94, 52);
      ctx.lineTo(94, 130);
      ctx.moveTo(106, 52);
      ctx.lineTo(106, 130);
      ctx.stroke();

      // Terracotta Pot
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.moveTo(66, 136);
      ctx.lineTo(134, 136);
      ctx.lineTo(124, 182);
      ctx.lineTo(76, 182);
      ctx.closePath();
      ctx.fill();

      // Pot Rim
      ctx.fillStyle = '#c2410c';
      ctx.fillRect(60, 128, 80, 12);

      // Pink Flower on Top
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(94, 34, 7, 0, Math.PI * 2);
      ctx.arc(106, 34, 7, 0, Math.PI * 2);
      ctx.arc(100, 28, 7, 0, Math.PI * 2);
      ctx.fill();
    })();

    // ---------------------------------------------------------
    // 3. LIGHTHOUSE BEACON (Alpha Beams, Stripes, Waves)
    // ---------------------------------------------------------
    (() => {
      const ctx = document.getElementById('art3').getContext('2d');
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, 200, 200);

      // Light Beams
      ctx.fillStyle = 'rgba(253, 224, 71, 0.25)';
      ctx.beginPath();
      ctx.moveTo(100, 55);
      ctx.lineTo(0, 25);
      ctx.lineTo(0, 85);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(100, 55);
      ctx.lineTo(200, 25);
      ctx.lineTo(200, 85);
      ctx.closePath();
      ctx.fill();

      // Tower Body (White)
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.moveTo(86, 65);
      ctx.lineTo(114, 65);
      ctx.lineTo(124, 165);
      ctx.lineTo(76, 165);
      ctx.closePath();
      ctx.fill();

      // Red Stripes
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(84, 90);
      ctx.lineTo(116, 90);
      ctx.lineTo(119, 115);
      ctx.lineTo(81, 115);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(79, 140);
      ctx.lineTo(121, 140);
      ctx.lineTo(124, 165);
      ctx.lineTo(76, 165);
      ctx.closePath();
      ctx.fill();

      // Lantern Room & Roof
      ctx.fillStyle = '#fde047';
      ctx.fillRect(88, 45, 24, 20);
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.moveTo(82, 45);
      ctx.lineTo(100, 26);
      ctx.lineTo(118, 45);
      ctx.closePath();
      ctx.fill();

      // Ocean Base
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(0, 165, 200, 35);
    })();

    // ---------------------------------------------------------
    // 4. VINTAGE CAMERA (Rounded Rectangles, Concentric Rings)
    // ---------------------------------------------------------
    (() => {
      const ctx = document.getElementById('art4').getContext('2d');
      ctx.fillStyle = '#e0f2fe';
      ctx.fillRect(0, 0, 200, 200);

      // Shutter Button & Top Bump
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(42, 52, 22, 10);
      ctx.fillStyle = '#475569';
      ctx.beginPath();
      ctx.moveTo(72, 60);
      ctx.lineTo(82, 46);
      ctx.lineTo(118, 46);
      ctx.lineTo(128, 60);
      ctx.closePath();
      ctx.fill();

      // Camera Body
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(26, 60, 148, 96, 14);
      ctx.fill();

      // Silver Top Trim
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(26, 68, 148, 22);

      // Viewfinder & Flash
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(90, 50, 20, 10);
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(144, 72, 18, 12);

      // Outer & Inner Lens
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(100, 114, 34, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = '#0ea5e9';
      ctx.beginPath();
      ctx.arc(100, 114, 20, 0, Math.PI * 2);
      ctx.fill();

      // Lens Glare
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(92, 106, 6, 0, Math.PI * 2);
      ctx.fill();
    })();

    // ---------------------------------------------------------
    // 5. SAILBOAT AT SUNSET (Linear Gradient, Triangles, Curves)
    // ---------------------------------------------------------
    (() => {
      const ctx = document.getElementById('art5').getContext('2d');
      const sky = ctx.createLinearGradient(0, 0, 0, 145);
      sky.addColorStop(0, '#fb7185');
      sky.addColorStop(1, '#fde047');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 200, 145);

      // Setting Sun
      ctx.fillStyle = '#fffbeb';
      ctx.beginPath();
      ctx.arc(135, 130, 28, 0, Math.PI * 2);
      ctx.fill();

      // Mast
      ctx.fillStyle = '#78350f';
      ctx.fillRect(96, 35, 4, 95);

      // Main Sail & Jib Sail
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(102, 40);
      ctx.lineTo(152, 122);
      ctx.lineTo(102, 122);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.moveTo(94, 52);
      ctx.lineTo(54, 122);
      ctx.lineTo(94, 122);
      ctx.closePath();
      ctx.fill();

      // Boat Hull
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.moveTo(42, 128);
      ctx.lineTo(158, 128);
      ctx.lineTo(140, 148);
      ctx.lineTo(60, 148);
      ctx.closePath();
      ctx.fill();

      // Ocean Water
      ctx.fillStyle = '#0369a1';
      ctx.fillRect(0, 145, 200, 55);
    })();

    // ---------------------------------------------------------
    // 6. HOT AIR BALLOON (Bezier Curves, Ropes, Basket)
    // ---------------------------------------------------------
    (() => {
      const ctx = document.getElementById('art6').getContext('2d');
      ctx.fillStyle = '#bae6fd';
      ctx.fillRect(0, 0, 200, 200);

      // Ropes
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(86, 128);
      ctx.lineTo(90, 152);
      ctx.moveTo(114, 128);
      ctx.lineTo(110, 152);
      ctx.stroke();

      // Outer Balloon Envelope
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(100, 22);
      ctx.bezierCurveTo(160, 22, 158, 92, 115, 130);
      ctx.lineTo(85, 130);
      ctx.bezierCurveTo(42, 92, 40, 22, 100, 22);
      ctx.fill();

      // Yellow Center Stripe
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.moveTo(100, 22);
      ctx.bezierCurveTo(132, 22, 130, 92, 108, 130);
      ctx.lineTo(92, 130);
      ctx.bezierCurveTo(70, 92, 68, 22, 100, 22);
      ctx.fill();

      // Blue Core Stripe
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.moveTo(100, 22);
      ctx.bezierCurveTo(114, 22, 112, 92, 103, 130);
      ctx.lineTo(97, 130);
      ctx.bezierCurveTo(88, 92, 86, 22, 100, 22);
      ctx.fill();

      // Wicker Basket
      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.roundRect(86, 152, 28, 24, 4);
      ctx.fill();
    })();

    // ---------------------------------------------------------
    // 7. MOUNTAIN TENT CAMP (Polygons, Pine Trees, Campfire)
    // ---------------------------------------------------------
    (() => {
      const ctx = document.getElementById('art7').getContext('2d');
      ctx.fillStyle = '#312e81';
      ctx.fillRect(0, 0, 200, 200);

      // Background Mountain
      ctx.fillStyle = '#4338ca';
      ctx.beginPath();
      ctx.moveTo(10, 155);
      ctx.lineTo(95, 42);
      ctx.lineTo(185, 155);
      ctx.closePath();
      ctx.fill();

      // Snow Cap
      ctx.fillStyle = '#e0e7ff';
      ctx.beginPath();
      ctx.moveTo(95, 42);
      ctx.lineTo(74, 70);
      ctx.lineTo(86, 65);
      ctx.lineTo(95, 74);
      ctx.lineTo(105, 65);
      ctx.lineTo(116, 70);
      ctx.closePath();
      ctx.fill();

      // Pine Tree
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.moveTo(36, 95);
      ctx.lineTo(18, 135);
      ctx.lineTo(54, 135);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#78350f';
      ctx.fillRect(33, 135, 6, 20);

      // Camping Tent
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(115, 95);
      ctx.lineTo(68, 155);
      ctx.lineTo(162, 155);
      ctx.closePath();
      ctx.fill();

      // Tent Door Opening
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.moveTo(115, 114);
      ctx.lineTo(98, 155);
      ctx.lineTo(132, 155);
      ctx.closePath();
      ctx.fill();

      // Ground
      ctx.fillStyle = '#14532d';
      ctx.fillRect(0, 155, 200, 45);
    })();

    // ---------------------------------------------------------
    // 8. CRESCENT MOON & CLOUDS (Composite Operation, Overlapping Circles)
    // ---------------------------------------------------------
    (() => {
      const ctx = document.getElementById('art8').getContext('2d');
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(0, 0, 200, 200);

      // Crescent Moon using offscreen canvas cutout
      const moonCanvas = document.createElement('canvas');
      moonCanvas.width = 200;
      moonCanvas.height = 200;
      const mCtx = moonCanvas.getContext('2d');
      mCtx.fillStyle = '#fde047';
      mCtx.beginPath();
      mCtx.arc(105, 85, 44, 0, Math.PI * 2);
      mCtx.fill();
      mCtx.globalCompositeOperation = 'destination-out';
      mCtx.beginPath();
      mCtx.arc(124, 72, 38, 0, Math.PI * 2);
      mCtx.fill();

      ctx.drawImage(moonCanvas, 0, 0);

      // Fluffy Cloud in Foreground
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(68, 135, 20, 0, Math.PI * 2);
      ctx.arc(94, 126, 26, 0, Math.PI * 2);
      ctx.arc(124, 132, 22, 0, Math.PI * 2);
      ctx.arc(144, 140, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(68, 132, 76, 23);
    })();
  </script>

</body>
</html>
